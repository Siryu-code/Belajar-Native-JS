<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOMBSKUY</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <header class="header-game">
      <h1 class="judul">BOMBSKUY</h1>
    </header>

    <div class="hud">
      <div class="hud-item">
        <span class="hud-label">Pemain</span>
        <span class="hud-nilai" id="hud-pemain">Siryu</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Skor</span>
        <span class="hud-nilai" id="hud-skor">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Nyawa</span>
        <span class="hud-nilai" id="hud-nyawa">3</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Waktu</span>
        <span class="hud-nilai" id="hud-waktu">00:00</span>
      </div>
    </div>

    <div id="game">
      <div class="cell" data-index="1"></div>
      <div class="cell" data-index="2"></div>
      <div class="cell" data-index="3"></div>
      <div class="cell" data-index="4"></div>
      <div class="cell" data-index="5"></div>
      <div class="cell" data-index="6"></div>
      <div class="cell" data-index="7"></div>
      <div class="cell" data-index="8"></div>
      <div class="cell" data-index="9"></div>
      <div class="cell" data-index="10"></div>
      <div class="cell" data-index="11"></div>
      <div class="cell" data-index="12"></div>
      <div class="cell" data-index="13"></div>
      <div class="cell" data-index="14"></div>
      <div class="cell" data-index="15"></div>
      <div class="cell" data-index="16"></div>
      <div class="cell" data-index="17"></div>
      <div class="cell" data-index="18"></div>
      <div class="cell" data-index="19"></div>
      <div class="cell" data-index="20"></div>
      <div class="cell" data-index="21"></div>
      <div class="cell" data-index="22"></div>
      <div class="cell" data-index="23"></div>
      <div class="cell" data-index="24"></div>
      <div class="cell" data-index="25"></div>
      <div class="cell" data-index="26"></div>
      <div class="cell" data-index="27"></div>
      <div class="cell" data-index="28"></div>
      <div class="cell" data-index="29"></div>
      <div class="cell" data-index="30"></div>
      <div class="cell" data-index="31"></div>
      <div class="cell" data-index="32"></div>
      <div class="cell" data-index="33"></div>
      <div class="cell" data-index="34"></div>
      <div class="cell" data-index="35"></div>
    </div>

    <div class="panel-kontrol">
      <button type="button" class="tombol" id="btn-pause">Pause</button>
      <button type="button" class="tombol" id="btn-restart">Restart</button>
    </div>

    <ul class="legenda">
      <li><span class="ikon ikon-dinding"></span>Dinding</li>
      <li><span class="ikon ikon-bom"></span>Bom</li>
      <li><span class="ikon ikon-pemain"></span>Pemain</li>
    </ul>

    <div class="modal" id="modal-gameover">
      <div class="modal-isi">
        <h2>Game Over</h2>
        <p id="skor-akhir">Skor Akhir: 0</span></p>
        <button type="button" class="tombol" id="btn-ulang">Main Lagi</button>
      </div>
    </div>

    <footer class="footer-game">
      <p>&copy; 2026 BOMBSKUY</p>
    </footer>
  </body>
</html>
