<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Latihan 1</title>
</head>
<body>
  <h1>Latihan JS ES5 - Level 1</h1>

  <h2>Fitur 1: Counter</h2>
  <p>Angka: <span id="angka">0</span></p>
  <button id="btnTambah">Tambah</button>
  <button id="btnReset">Reset</button>

  <h2>Fitur 2: Sapaan</h2>
  <input type="text" id="inputNama" placeholder="Nama kamu">
  <button id="btnSapa">Sapa</button>
  <p id="hasilSapa"></p>

  <h2>Fitur 3: Cek Kelulusan</h2>
  <input type="number" id="inputNilai" placeholder="Nilai 0-100">
  <button id="btnCek">Cek</button>
  <p id="hasilNilai"></p>

  <h2>Fitur 4: Daftar Buah</h2>
  <button id="btnTampil">Tampilkan Daftar</button>
  <ul id="daftarBuah"></ul>

  <script src="latihan1.js"></script>
</body>
</html>
